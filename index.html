<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">A personal index</p>
        <h1>Stargazers log</h1>
        <p class="intro">A running list of repositories worth keeping close.</p>
      </header>

      <section class="repository-section" aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Starred repositories</h2>
          <span id="repository-count" class="repository-count"></span>
        </div>
        <p id="list-status" class="list-status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list" aria-label="Starred repositories"></ul>
      </section>
    </main>
  </body>
</html>
